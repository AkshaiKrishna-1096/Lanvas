[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanvas"
version = "1.0.0"
description = "LAN-only, multi-user collaborative whiteboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["client", "common", "server"]
